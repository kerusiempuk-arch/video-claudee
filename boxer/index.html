<!doctype html>
<html lang="ms">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #000; }
      body { font-family: "Inter", sans-serif; }
      .seg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; }
      /* Jump cut disilih dengan punch-in supaya potongan nampak sengaja */
      .seg.punch { transform: scale(1.07); transform-origin: 50% 4%; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="19.46" data-width="1080" data-height="1920">
      <!--
        Potongan footage asal (src.mp4):
          S1 0.00–7.13   | buang senyap 7.13–7.37
          S2 7.37–12.95  | buang ulangan "getah dia lembut" 12.95–15.00
          S3 15.00–16.42 | buang senyap 16.42–16.66
          S4 16.66–19.37 | buang senyap 19.37–19.78
          S5 19.78–22.40
      -->
      <video id="seg1" class="clip seg" src="src.mp4" playsinline data-has-audio="true" data-volume="1"
        data-start="0" data-media-start="0" data-duration="7.13" data-track-index="0"></video>
      <video id="seg2" class="clip seg punch" src="src.mp4" playsinline data-has-audio="true" data-volume="1"
        data-start="7.13" data-media-start="7.37" data-duration="5.58" data-track-index="0"></video>
      <video id="seg3" class="clip seg" src="src.mp4" playsinline data-has-audio="true" data-volume="1"
        data-start="12.71" data-media-start="15" data-duration="1.42" data-track-index="0"></video>
      <video id="seg4" class="clip seg punch" src="src.mp4" playsinline data-has-audio="true" data-volume="1"
        data-start="14.13" data-media-start="16.66" data-duration="2.71" data-track-index="0"></video>
      <video id="seg5" class="clip seg" src="src.mp4" playsinline data-has-audio="true" data-volume="1"
        data-start="16.84" data-media-start="19.78" data-duration="2.62" data-track-index="0"></video>

      <div id="hook" data-composition-id="hook" data-composition-src="compositions/hook.html"
        data-start="0" data-duration="3.35" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 5"></div>
      <div id="vs" data-composition-id="vs" data-composition-src="compositions/vs.html"
        data-start="3.35" data-duration="2.85" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 5"></div>
      <div id="f1" data-composition-id="f1" data-composition-src="compositions/f1.html"
        data-start="6.2" data-duration="4.26" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 5"></div>
      <div id="f2" data-composition-id="f2" data-composition-src="compositions/f2.html"
        data-start="10.46" data-duration="3.6" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 5"></div>
      <div id="f3" data-composition-id="f3" data-composition-src="compositions/f3.html"
        data-start="14.06" data-duration="2.78" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 5"></div>
      <div id="cta" data-composition-id="cta" data-composition-src="compositions/cta.html"
        data-start="16.84" data-duration="2.62" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 5"></div>

      <div id="rail" data-composition-id="rail" data-composition-src="compositions/rail.html"
        data-start="6.2" data-duration="10.64" data-track-index="2" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 6"></div>

      <div id="captions" data-composition-id="captions" data-composition-src="compositions/captions.html"
        data-start="0" data-duration="19.46" data-track-index="3" data-track-kind="captions"
        data-width="1080" data-height="1920" style="z-index: 7"></div>

      <!-- Sound effects (pustaka terbina HyperFrames), di bawah suara -->
      <audio id="sfx-pop-hook" src="assets/sfx/pop.mp3" data-start="0.3" data-duration="0.72" data-volume="0.35" data-track-index="4"></audio>
      <audio id="sfx-whoosh-vs" src="assets/sfx/whoosh-short.mp3" data-start="3.42" data-duration="0.57" data-volume="0.35" data-track-index="4"></audio>
      <audio id="sfx-click-vs" src="assets/sfx/click.mp3" data-start="4.25" data-duration="0.37" data-volume="0.35" data-track-index="5"></audio>
      <audio id="sfx-sparkle-vs" src="assets/sfx/sparkle.mp3" data-start="4.45" data-duration="1.8" data-volume="0.3" data-track-index="4"></audio>
      <audio id="sfx-whoosh-f1" src="assets/sfx/whoosh-short.mp3" data-start="6.28" data-duration="0.57" data-volume="0.35" data-track-index="4"></audio>
      <audio id="sfx-pop-f1" src="assets/sfx/pop.mp3" data-start="6.6" data-duration="0.72" data-volume="0.35" data-track-index="5"></audio>
      <audio id="sfx-whoosh-f1b" src="assets/sfx/whoosh-short.mp3" data-start="8.26" data-duration="0.57" data-volume="0.3" data-track-index="4"></audio>
      <audio id="sfx-whoosh-f2" src="assets/sfx/whoosh-short.mp3" data-start="10.54" data-duration="0.57" data-volume="0.35" data-track-index="4"></audio>
      <audio id="sfx-click-f2a" src="assets/sfx/click.mp3" data-start="12.41" data-duration="0.37" data-volume="0.4" data-track-index="4"></audio>
      <audio id="sfx-click-f2b" src="assets/sfx/click.mp3" data-start="12.74" data-duration="0.37" data-volume="0.4" data-track-index="5"></audio>
      <audio id="sfx-whoosh-f3" src="assets/sfx/whoosh-short.mp3" data-start="14.1" data-duration="0.57" data-volume="0.35" data-track-index="4"></audio>
      <audio id="sfx-pop-f3a" src="assets/sfx/pop.mp3" data-start="14.46" data-duration="0.72" data-volume="0.3" data-track-index="6"></audio>
      <audio id="sfx-pop-f3b" src="assets/sfx/pop.mp3" data-start="15.36" data-duration="0.72" data-volume="0.3" data-track-index="5"></audio>
      <audio id="sfx-whoosh-cta" src="assets/sfx/whoosh-short.mp3" data-start="16.84" data-duration="0.57" data-volume="0.35" data-track-index="4"></audio>

    </div>

    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
